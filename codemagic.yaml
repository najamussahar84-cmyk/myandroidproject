workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 30
    instance_type: linux
    scripts:
      - name: Build Android App
        script: |
          cd SnookerScoreCalculator
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - SnookerScoreCalculator/app/build/outputs/apk/debug/*.apk